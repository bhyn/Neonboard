<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>네온 응원 전광판</title><style>
:root{--ink:#eaffff;--glow:35px;--size:28vw}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:white;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden}#board{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}#stage{width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}#message{font-weight:900;font-size:var(--size);line-height:1.0;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;color:var(--ink);text-shadow:0 0 3px var(--ink),0 0 calc(var(--glow)*.3) var(--ink),0 0 var(--glow) var(--ink),0 0 calc(var(--glow)*1.8) var(--ink);padding:0;max-width:100%;will-change:transform}#stage.scroll #message{white-space:pre;overflow-wrap:normal;max-width:none;flex-shrink:0;animation:marquee var(--duration,10s) linear infinite}@keyframes marquee{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}#panel{position:fixed;z-index:5;bottom:16px;left:50%;transform:translateX(-50%);width:min(94vw,660px);padding:16px;border:1px solid #444;border-radius:18px;background:rgba(25,25,30,.96);box-shadow:0 8px 40px #000;max-height:80vh;overflow:auto}h1{font-size:17px;margin:0 0 12px}label{font-size:13px;color:#ddd}textarea{width:100%;height:58px;resize:vertical;background:#101014;border:1px solid #555;border-radius:9px;color:white;padding:10px;font:inherit}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.field{display:flex;flex-direction:column;gap:5px}input[type=range]{width:100%;accent-color:#65faff}.colors{display:flex;gap:8px;margin-top:8px}.swatch{width:42px;height:36px;border:2px solid #777;border-radius:9px;cursor:pointer}.swatch[aria-pressed=true]{outline:2px solid white;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button{cursor:pointer;color:white;border:1px solid #666;background:#333;border-radius:10px;padding:10px 13px;font-weight:700}button.primary{background:#eaffff;color:#000;border-color:#eaffff}#reopen{position:fixed;z-index:4;top:10px;right:10px;background:#222c;opacity:.2;padding:8px 10px}#reopen:hover,#reopen:focus{opacity:1}.hidden{display:none!important}.hint{font-size:11px;color:#aaa;margin-top:8px}@media(max-width:480px){#panel{bottom:8px;padding:12px}.controls{gap:8px}}
</style></head><body><main id="board"><div id="stage"><div id="message">아이유 사랑해 💚</div></div></main><button id="reopen" class="hidden" aria-label="설정 열기">⚙ 설정</button><section id="panel"><h1>✨ 네온 응원 전광판 설정</h1><label for="words">응원 문구 (줄바꿈 가능)</label><textarea id="words">아이유 사랑해 💚</textarea><label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input id="autofit" type="checkbox" checked> 화면에 맞게 글씨 최대한 키우기 (추천)</label><div class="controls"><div class="field"><label for="size">수동 글씨 크기 <output id="sizeOut">28</output>vw</label><input id="size" type="range" min="5" max="100" value="28"></div><div class="field"><label for="glow">네온 빛 번짐 <output id="glowOut">35</output>px</label><input id="glow" type="range" min="0" max="100" value="35"></div><div class="field"><label for="speed">스크롤 속도 <output id="speedOut">10</output>초</label><input id="speed" type="range" min="3" max="30" value="10"></div><div class="field"><label><input id="scroll" type="checkbox"> 문구 좌우 스크롤</label><label><input id="blink" type="checkbox"> 반짝임 효과</label></div></div><label>글씨 색상</label><div class="colors"><button class="swatch" style="background:#eaffff" data-color="#eaffff" aria-label="네온 화이트" aria-pressed="true"></button><button class="swatch" style="background:#55f5ff" data-color="#55f5ff" aria-label="형광 하늘색" aria-pressed="false"></button><button class="swatch" style="background:#66ff55" data-color="#66ff55" aria-label="형광 초록색" aria-pressed="false"></button></div><div class="actions"><button class="primary" id="start">▶ 응원 시작 / 전체 화면</button><button id="hide">설정 숨기기</button><button id="reset">초기화</button></div><div class="hint">자동 맞춤을 켜면 문구가 화면에 들어가는 최대 크기로 표시돼요. 전체 화면이 안 되면 브라우저 메뉴에서 전체 화면을 선택하세요.</div></section><script>
const $=s=>document.querySelector(s),root=document.documentElement,msg=$('#message'),stage=$('#stage'),panel=$('#panel'),reopen=$('#reopen');let blinkTimer;function fitText(){if(!$('#autofit').checked||$('#scroll').checked)return;const box=$('#board');const availableW=box.clientWidth*.965,availableH=box.clientHeight*.94;msg.style.fontSize='10px';msg.style.whiteSpace='pre';msg.style.maxWidth='none';let lo=5,hi=900;for(let i=0;i<18;i++){let mid=(lo+hi)/2;msg.style.fontSize=mid+'px';if(msg.scrollWidth<=availableW&&msg.scrollHeight<=availableH)lo=mid;else hi=mid}msg.style.fontSize=lo+'px';msg.style.whiteSpace='pre-wrap';msg.style.maxWidth='100%'}function update(){msg.textContent=$('#words').value||' ';root.style.setProperty('--size',$('#size').value+'vw');msg.style.fontSize='';msg.style.whiteSpace='';msg.style.maxWidth='';root.style.setProperty('--glow',$('#glow').value+'px');$('#sizeOut').textContent=$('#size').value;$('#glowOut').textContent=$('#glow').value;$('#speedOut').textContent=$('#speed').value;stage.style.setProperty('--duration',$('#speed').value+'s');stage.classList.toggle('scroll',$('#scroll').checked);clearInterval(blinkTimer);msg.style.opacity='1';if($('#blink').checked)blinkTimer=setInterval(()=>{msg.style.opacity=Math.random()>.2?'1':'.65'},350);requestAnimationFrame(fitText)}document.querySelectorAll('input,textarea').forEach(e=>e.addEventListener('input',update));document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{root.style.setProperty('--ink',b.dataset.color);document.querySelectorAll('.swatch').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});function hide(){panel.classList.add('hidden');reopen.classList.remove('hidden')}$('#hide').onclick=hide;reopen.onclick=()=>{panel.classList.remove('hidden');reopen.classList.add('hidden')};$('#start').onclick=async()=>{hide();try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}};$('#reset').onclick=()=>{$('#words').value='아이유 사랑해 💚';$('#size').value=28;$('#glow').value=35;$('#speed').value=10;$('#scroll').checked=false;$('#blink').checked=false;$('#autofit').checked=true;document.querySelector('[data-color="#eaffff"]').click();update()};window.addEventListener('resize',()=>requestAnimationFrame(fitText));document.fonts.ready.then(fitText);update();</script></body></html>
